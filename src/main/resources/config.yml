# ============================================================
# WBDAddon 配置文件
# WarZBombDefuse 的第三方附加组件合集
#
# 修改后执行 /wbdaddon reload 即可生效，无需重启服务器。
# 颜色代码用 & 符号，例如 &c 表示红色。
# ============================================================

# 模块总开关。每个模块可以独立启停，互不影响。
modules:

  # ----------------------------------------------------------
  # 击杀报告模块
  # 功能：替换默认的淘汰消息，显示击杀者与武器；
  #       回合结束时给每位玩家单独发送各自的伤害统计。
  # ----------------------------------------------------------
  kill-reports:
    enabled: true

    # 是否替换 WarZBombDefuse 默认的淘汰消息
    replace-default-death-message: true

    # 是否在回合结束时给每位玩家单独发送各自的伤害统计
    show-round-summary: true

    # 伤害数值保留几位小数
    damage-decimal-places: 1

    # 有击杀者时的死亡消息（主动句，避免被字句的翻译腔）
    # 占位符：%victim% 被淘汰者，%killer% 击杀者，%weapon% 武器名
    death-message-with-killer: "&c%killer% &7使用 &e%weapon% &7淘汰了 &c%victim%"

    # 无击杀者时的死亡消息（自杀、C4 爆炸、摔落等）
    # 占位符：%victim% 被淘汰者
    death-message-no-killer: "&c%victim% &7已被淘汰"

    # 每位玩家独享的伤害统计标题和页脚（用青色 &b 与 WBD 淘汰消息区分）
    round-summary-title: "&b====== 你的伤害统计 ======"
    round-summary-footer: "&b========================"

    # 手雷 / 燃烧瓶这类「没有直接攻击者」的伤害归属。
    # 开启后会在 WBD 之前解析凶手（爆炸实体 / 区域云 / 最近的投掷者），
    # 致死时按正确凶手结算，播报里就能看到「XXX 使用 M67 手雷 淘汰了 YYY」。
    indirect-attribution: true

    # 找不到实体来源时，按「最近一次扔投掷物」猜凶手的范围与时间窗
    indirect-radius: 12.0
    indirect-seconds: 15

    # 排查用：输出投掷记录与归属过程
    debug: false

    # 每个玩家对自己造成伤害的目标的单行格式
    # 占位符：%victim% 被打的玩家，%damage% 你对 TA 造成的伤害
    damage-line-format: "你对 &f%victim% &7造成了 &b%damage% &7伤害"

  # ----------------------------------------------------------
  # 默认装备
  # 功能：每回合给双方发默认手枪 + 默认刀（不买枪也能打）。
  #       物品直接克隆商店商品的发放物品，所以和商店卖的一模一样。
  #       发出去的物品带 wbd_default 标记：换掉时丢到地上，不退款。
  # ----------------------------------------------------------
  default-loadout:
    enabled: true

    # T 方默认手枪（写商店商品 id 或 TacZ GunId 都行）
    t:
      - G17

    # CT 方默认手枪
    ct:
      - P320

    # 默认近战（写商品 id 或 GunId）
    melee: "tacz_modern_kinetic_gun_6"

    # 身上已经有同类武器就不再发（上一回合活下来、自己买了枪，都不会被覆盖）
    only-if-missing: true

    debug: false

  # ----------------------------------------------------------
  # 交互限制
  # 功能：战局内禁止与指定方块交互（默认只拦活板门）。
  #       只作用于比赛中的玩家，大厅与观战不受影响。
  # ----------------------------------------------------------
  interaction-lock:
    enabled: true

    # 是否拦所有活板门（现代 Material 里是 OAK_TRAPDOOR / SPRUCE_TRAPDOOR …）
    block-trapdoors: true

    # 额外要拦的方块，按 Bukkit Material 名称填写
    blocked-materials: []
      # - LEVER
      # - STONE_BUTTON

    # 拦下时是否提示玩家（默认静默，避免刷屏）
    notify: false
    notify-message: "&7战局内不能使用这个。"

  # ----------------------------------------------------------
  # 击杀奖励
  # 功能：按武器发不同的击杀赏金（CS 式：刀杀重赏、大狙低赏）。
  #       具体数字在 kill-rewards.yml 里单独配，首次启动自动生成。
  #       WBD 本体已经按 kill-money 发过一份，这里只补差额。
  # ----------------------------------------------------------
  kill-reward:
    enabled: true

    # 排查用：把「谁杀了谁、目标多少、WBD 已发多少、补多少」打到控制台
    debug: false

  # ----------------------------------------------------------
  # 比赛状态显示模块
  # 功能：顶部（ActionBar）显示 T / CT 当前存活人数；
  #       炸弹安放后用 BossBar 显示倒计时进度条，爆/拆后消失。
  # ----------------------------------------------------------
  match-status:
    enabled: true

    # 是否在顶部用 ActionBar 显示双方存活人数
    enable-alive-action-bar: true

    # 是否用 BossBar 显示炸弹倒计时（安放后出现，爆/拆后消失）
    enable-bomb-bar: true

    # 刷新间隔（tick）。20 = 1 秒，调大省资源，调小更实时
    update-interval-ticks: 2

    # 存活人数文字格式
    # 占位符：%t_alive%/%t_total% T 存活/总，%ct_alive%/%ct_total% CT 存活/总
    alive-line-format: "&cT 存活 &f%t_alive%&7/&f%t_total%   &bCT 存活 &f%ct_alive%&7/&f%ct_total%"

    # 存活显示样式：number = 数字（3/5）；block = 方块（每人一个方块）
    alive-display-style: number

    # ↓ 以下仅在 alive-display-style: block 时生效
    # 默认存活/淘汰都用同一个「■」字形，靠亮色/暗色区分，
    # 保证两者绝对等宽；想换成「填/空」样式就把 block-dead-char 改成 "□"
    block-alive-char: "■"
    block-dead-char: "■"
    block-t-color: "&c"           # T 方存活（亮红）
    block-t-dead-color: "&4"      # T 方淘汰（暗红）
    block-ct-color: "&9"          # CT 方存活（亮蓝）
    block-ct-dead-color: "&1"     # CT 方淘汰（暗蓝）
    # 方块行格式；%t_blocks% / %ct_blocks% = 两队的方块串（淘汰在前、存活在后）
    block-line-format: "&cT方 %t_blocks%  &9CT方 %ct_blocks%"

    # 炸弹倒计时 BossBar 的标题、颜色、样式
    # 颜色可选：PINK BLUE RED GREEN YELLOW PURPLE WHITE
    # 样式可选：SOLID SEGMENTED_6 SEGMENTED_10 SEGMENTED_12 SEGMENTED_20
    bomb-bar-title: "&c炸弹 &7还有 &e%sec% &7秒爆炸"
    bomb-bar-color: RED
    bomb-bar-style: SOLID

  # ----------------------------------------------------------
  # 拆弹声音提示模块
  # 功能：CT 开始拆弹时，在 C4 位置向全图播放可定位的音效，让 T 阵营
  #       能凭声音判断「有人在拆弹」以及大致方位，从而回防博弈。
  #
  #       WBD 本体只在「拆除成功」和「进度被中断」时有音效，
  #       开始拆弹与整个拆弹过程是完全静音的，本模块补的就是这一段。
  # ----------------------------------------------------------
  bomb-defuse-sound:
    enabled: true

    # 开始拆弹提示音：低沉一声「嘟」，与滴答的高音形成电子设备启动感。
    # 音效名必须是本服务端存在的 Bukkit Sound 枚举名，留空 "" 表示关闭。
    # 挑音效用 /wbdaddon sound 试听，不带参数会列出推荐清单。
    # 音量决定可听距离，约等于 16 × 音量（格）：2.0 ≈ 32 格。
    # 客户端会对音量限幅，所以调大只会传得更远，不会把近处玩家震聋。
    start-sound: BLOCK_LEVER_CLICK
    start-volume: 1.0
    start-pitch: 1.2

    # 拆弹过程中的滴答声。留空 "" 关闭滴答。
    # 默认用柔和的电子「叮」声（BLOCK_NOTE_BLOCK_PLING），不刺耳
    tick-sound: BLOCK_NOTE_BLOCK_PLING
    tick-volume: 1.5
    tick-pitch: 1.9
    # 滴答间隔（tick）。20 tick = 1 秒。调小更急促，调大更从容
    tick-interval-ticks: 8

    # 拆弹中断（松手、被打断、拆弹者死亡）提示音。
    # WBD 本体已对当事人播放 cancel 音效，故默认留空以免重复
    cancel-sound: ""
    cancel-volume: 2.0
    cancel-pitch: 0.8

    # 拆弹成功提示音。WBD 本体已播 bomb-defused，故默认留空以免重复
    complete-sound: ""
    complete-volume: 2.0
    complete-pitch: 1.8

    # 听众范围：
    #   arena = 只播给该竞技场内的玩家（含已淘汰的旁观者），与 WBD 惯例一致
    #   world = 播给炸弹所在世界的所有玩家（含大厅与其他竞技场）
    # 两种范围都以 C4 位置为音源，因此都带方位感
    audience: arena

    # 兜底保护：单次拆弹超过该秒数后强制停止滴答。
    # 正常拆弹只有几秒，这一项仅用于事件丢失时防止滴答停不下来
    max-duration-seconds: 30

    # 排查用：在控制台输出拆弹事件的触发日志
    debug: false

  # ----------------------------------------------------------
  # 竞技场饥饿锁定模块
  # 功能：竞技场玩家跑步会消耗饥饿、饿到跑不动；满饥饿又触发自然回血。
  #       MC 规则：跑速只在饥饿 <6 变慢，自然回血需饥饿 ≥18。
  #       所以把竞技场玩家饥饿恒定到 17（跑速恒定、不自然回血），
  #       并把饱和度清零封死回血条件。只作用于竞技场玩家，不影响全局。
  # ----------------------------------------------------------
  arena-food:
    enabled: true

    # 重置间隔（tick）。20 = 1 秒
    update-interval-ticks: 5

    # 恒定的饥饿值（10-19 都安全：跑速正常且不回血；默认 17 视觉接近满）
    food-level: 17

    # 恒定的饱和度（0 封死自然回血）
    saturation: 0

  # ----------------------------------------------------------
  # 阵亡掉落模块
  # 功能：WBD 不会走原版死亡流程 —— 它在致死时取消伤害、自己调 eliminate()
  #       处理淘汰，所以玩家阵亡时原版掉落根本不会发生。本模块补上：
  #       - 阵亡者背包里的枪掉在死亡点
  #       - 炸弹携带者阵亡时 C4 掉在地上（实验性，仅 T 可拾取）
  # ----------------------------------------------------------
  # ----------------------------------------------------------
  # 药水效果清理模块
  # 功能：进入竞技场、每回合开始时清空玩家身上的药水效果，
  #       防止带抗性 / 速度 / 力量进场占便宜。
  #       WBD 的背包快照会记录进场前效果，离场时自动还原，不会永久丢失。
  # ----------------------------------------------------------
  arena-effects:
    enabled: true

    # 进场时清除（在 WBD 记录快照之后执行）
    clear-on-join: true

    # 每回合开始时再清一次，防止回合中途获得的效果跨回合保留
    clear-on-round-start: true

    # 白名单：这些效果不清除（Bukkit PotionEffectType 名称，如 NIGHT_VISION）
    keep: []

    # 排查用：输出清除日志
    debug: false

  # ----------------------------------------------------------
  # 进场位置兜底模块
  # 功能：进场时记录玩家「进来之前的位置」，服务器重启 / 插件卸载时传回，
  #       重启后登录再补一次。只兜底位置，背包 / 血量仍由 WBD 快照负责。
  # ----------------------------------------------------------
  position-backup:
    enabled: true

    # 插件卸载 / 服务器关闭时，把仍在场的玩家传回记录的位置
    restore-on-disable: true

    # 服务器重启后玩家登录时，再补一次传送（然后删除记录）
    restore-on-rejoin: true

    # 排查用
    debug: false

  arena-drops:
    enabled: true

    # 是否掉落 TacZ 枪械。只认枪，弹药 / 配件 / 投掷物都不会掉
    drop-guns: true

    # 掉哪些枪：
    #   held = 只掉死亡瞬间正在用的那把（手里不是枪时回退到最近持过的枪）
    #   all  = 背包里所有 TacZ 枪全部掉出（会爆一地装备）
    drop-mode: held

    # 是否让 C4 掉在死亡点。
    #
    # WBD 的原生行为是「携带者一死，炸弹立刻转交给下一个存活 T」，炸弹永不落地。
    # 开启后本模块会抢在 WBD 之前把 C4 取下丢在地上，并把 WBD 的
    # currentBombCarrier 重置为空，从而跳过自动转交；拾取仍由 WBD 的规则
    # 限制为仅 T（本模块再加一层兜底）。
    #
    # ⚠ 实验性：依赖 WBD 内部字段名，WBD 升级后可能失效。
    #   失效时只会退化成「炸弹仍自动转交」，不会崩服，但地上会多出一个 C4 实体。
    drop-c4: true

    # 是否放开 WBD 对「手动丢弃 C4」的限制。
    # WBD 只在 FREEZE/LIVE、T 方存活、炸弹未安放时才允许丢 C4，其余情况直接取消事件。
    # 开启后本模块会在 WBD 之后把取消撤销，让你随时能把 C4 丢在地上等队友捡。
    allow-c4-drop: true

    # 手动丢出 C4 后，多长时间内禁止「丢包者本人」再把它捡回去（毫秒）。
    # WBD 允许丢弃时会把 pickupDelay 设成 0，不拦一下的话按 Q 的下一 tick
    # 炸弹就回到自己手里，看起来像没丢出去。队友拾取不受此限制。
    # 设为 0 关闭。
    c4-self-pickup-block-ms: 5000

    # 掉在地上的 C4 显示的常显名牌（留空则不带名牌）
    c4-display-name: "&cC4 炸弹"


    # 排查用：输出掉落日志
    debug: false

  # ----------------------------------------------------------
  # 队伍护甲模块
  # 功能：给 T / CT 穿固定颜色的染色皮革甲，只做视觉区分。
  #       皮革甲自带 7 点护甲（头1/胸3/腿2/靴1），这里用等量的负数
  #       GENERIC_ARMOR 属性修饰符抵消为 0，所以它不提供任何防护，
  #       也不影响对枪数值；同时上 Unbreakable 并隐藏属性行。
  #       护甲槽会被锁死（不能脱下/丢弃/拖拽），重生与回合重置后自动补穿。
  # ----------------------------------------------------------
  team-armor:
    enabled: true

    # 补穿检查间隔（tick）。20 = 1 秒
    update-interval-ticks: 20

    # T / CT 的染色颜色，取值见 Bukkit DyeColor（RED / BLUE / GREEN / ...）
    t-color: RED
    ct-color: BLUE

    # true：把护甲值抵消为 0（推荐）；false：保留皮革甲原始的 7 点护甲
    zero-protection: true

    # 是否强行顶掉玩家原有的护甲（钻石套、下界合金套等）。
    #
    # false（默认）：只往空护甲槽里穿，或替换本模块自己以前发的队服；
    #                玩家自己穿的护甲一律不动。代价是他这局没有队伍颜色，
    #                只能靠头顶/小地图分辨 —— 但不会莫名其妙丢了一套钻石甲。
    #
    # true：四个槽位全部强制换成队服，原有护甲会被丢到玩家脚下（不销毁）。
    #       只有确认「本模式里玩家不可能自备护甲」时才建议打开。
    overwrite-existing: false

  # ----------------------------------------------------------
  # 回合事件模块
  # 功能：回合结束自动清理竞技场掉落物；回合开始时提示
  #       「上半场最终局」与「赛点」。
  # ----------------------------------------------------------
  # ----------------------------------------------------------
  # 冻结倒计时音效
  # 功能：回合冻结最后几秒，每秒一声轻短的「哒」，越接近开局音调越高。
  # ----------------------------------------------------------
  freeze-countdown:
    enabled: true

    # 从最后几秒开始（冻结时长不足时自动只取放得下的最后几秒）
    seconds: 4

    # 音效名（Bukkit Sound 枚举）
    sound: BLOCK_NOTE_BLOCK_HAT

    # 音量（0.0 - 1.0），压小一点，别盖过枪声
    volume: 0.35

    # 起始音调与每秒升调幅度（越接近开局越高）
    base-pitch: 1.6
    pitch-step: 0.15

  # ----------------------------------------------------------
  # 少人经济补偿
  # 功能：从指定回合开始，每回合比较双方参赛人数；人数少的一方
  #       每人获得一笔经济补偿。人数相同或有一方为空时不发。
  #       只算开局人数，不按存活人数反复结算。
  # ----------------------------------------------------------
  short-handed-compensation:
    enabled: true

    # 从第几回合开始补偿（第 3 回合起写 3）
    start-round: 3

    # 每名少人方玩家每回合的补偿金额
    amount: 1000

    # 是否给获得补偿的玩家发一条提示
    announce: true

    # 提示文案。占位符：%amount% 实际到账金额，%team% T/CT，%diff% 人数差
    message: "&e本回合人数较少，获得 &6+$%amount% &e经济补偿。"

    # 排查用：输出每回合双方人数与补偿结果
    debug: false

  # ----------------------------------------------------------
  # 主菜单
  # 功能：/wbda 打开箱子菜单：模式选择 / 比赛总结 / 个人资料。
  #       爆破模式支持自动匹配、手动选房、选阵营（T/CT/自动/观战）；
  #       接入 WBDTeamDeathmatch 时会多出团队死斗入口。
  # ----------------------------------------------------------
  menu:
    enabled: true

    # 保留多少场历史比赛（含每名玩家的 K/D），供 /wbda → 比赛总结 查看详情
    history-size: 30

    # 开菜单的按键：Shift + F（服务端能识别的按键只有「交换副手」）。
    # 已经开着商店/箱子等界面时不会抢。off = 只能用 /wbda。
    open-key: sneak-swap-hands

  # ----------------------------------------------------------
  # 回合结算展示
  # 功能：回合结束标题显示胜方 + MVP，副标题随机挑一条本场趣闻
  #       （全歼用时 / 首杀时间 / C4 爆炸 / 命中率 / 爆头 / 下包拆包等）。
  # ----------------------------------------------------------
  round-summary:
    enabled: true
    title-fade-in: 10
    title-stay: 60
    title-fade-out: 20

  round-events:
    enabled: true

    # 是否在「下一回合开始时」清理竞技场边界内的掉落物。
    # 回合结束后的结算冷却期间掉落物会保留，新回合真正开始才清（与 CS 一致）。
    # 只清 arena 的 boundary 范围，不影响场地外。
    clear-drops-on-round-start: true

    # 上半场最后一回合（换边前，即 settings.side-switch-round 那一回合）
    half-final-enabled: true
    half-final-title: "&6&l上半场最终局"
    half-final-subtitle: ""          # 留空 = 只显示主标题

    # 赛点：任意一方胜场达到「rounds-to-win - 1」后，每回合开始提示
    match-point-enabled: true
    match-point-title: "&c&l赛点"
    match-point-subtitle: ""        # 留空 = 只显示主标题

    # 标题显示时长（tick）。20 tick = 1 秒
    title-fade-in: 10
    title-stay: 50
    title-fade-out: 20

    debug: false

  # ----------------------------------------------------------
  # 商店价格标签
  # 功能：在商店商品的 lore 下方补一行售价，买得起绿色、买不起红色。
  #       WBD 原生界面只显示物品自己的 lore，玩家看不到价格，
  #       也就没法比较买哪个更合算。
  # ----------------------------------------------------------
  shop-price:
    enabled: true

    # 是否按玩家当前余额染色（关掉就统一用一种颜色）
    check-balance: true

    # 买得起时的文案。占位符：%price%
    format: "&7价格：&e$%price%"

    # 买不起时的文案
    unaffordable-format: "&7价格：&c$%price% &8(金钱不足)"

    # 排查用：把「槽位 → 商品 id → 价格」打到控制台
    debug: false

  # ----------------------------------------------------------
  # 观战第一视角
  # 功能：阵亡后自动把观战视角挂到存活队友身上（原版 setSpectatorTarget），
  #       目标阵亡/离场自动换人；也可以 /spectate [玩家|off] 手动切换。
  #       注意：原版观战视角不渲染目标的持物与手部动作，这是客户端限制。
  # ----------------------------------------------------------
  spectate-camera:
    enabled: true

    # 阵亡后是否自动跟随存活队友（关掉就只能用 /spectate 手动看）
    auto: true

    # 是否只跟随同阵营（关掉可以看任何人）
    only-teammates: true

    # 检查间隔（tick）。20 = 1 秒；目标死亡/退场后最迟这么久会换人
    interval-ticks: 20

    # 顶部「战地记录仪」BossBar：标题显示观战对象与他的武器，进度条是他的血量比例
    hud: true

    # BossBar 标题。占位符：%player% 观战对象，%weapon% 他手里的武器
    bar-title: "&6战地记录仪 &8| &7观战 &f%player% &8| &e%weapon%"

    # BossBar 颜色：PINK / BLUE / RED / GREEN / YELLOW / PURPLE / WHITE
    bar-color: YELLOW

    # 鼠标左键 / 右键切换上一个 / 下一个队友（仅阵亡观战时生效）
    key-switch: true

    # 全队阵亡时，把视角拉到最后一个队友倒下的位置（每人每次团灭只拉一次）
    death-camera: true

    # 自己阵亡后，镜头先按在自己倒下的位置多少 tick 再切队友。
    # 30 = 1.5 秒。给观战者一个缓冲，别一死就被甩到别人脸上。0 = 立即切
    death-hold-ticks: 30

  # ----------------------------------------------------------
  # 昵称标签
  # 功能：队友看得见名牌，敌人看不见——按「观察者自己的计分板」逐人控制，
  #       所以只影响你这边的视角，不会把敌人的位置暴露给对面。
  #       与 WBD 自带的 [队友] 前缀并存：这边只把「非队友」塞进隐藏队伍。
  #       ⚠ 不要同时启用 WarZHideName，两者都靠计分板队伍，会互相抢人。
  # ----------------------------------------------------------
  name-tag:
    enabled: true

    # 是否隐藏敌人名牌（关掉就只同步队伍、不做隐藏）
    hide-enemies: true

    # 同步间隔（tick）。20 = 1 秒。
    # 名单没变化时不会重复写队伍，所以调小只是更跟手。
    interval-ticks: 10

  # ----------------------------------------------------------
  # 队友轮廓发光
  # 功能：只对同阵营玩家显示队友的发光轮廓（隔墙可见），敌人看不到。
  #       原版发光是全局的（谁都能看见），要「只有队友可见」只能逐人发包，
  #       因此本模块依赖 ProtocolLib；没装时自动跳过，不影响其他功能。
  # ----------------------------------------------------------
  teammate-glow:
    enabled: true

    # 同步间隔（tick）。20 = 1 秒。
    # 状态没变化时不会重复发包，所以调小只是更跟手，不会成倍增加流量。
    interval-ticks: 20

  # ----------------------------------------------------------
  # JourneyMap 桥接模块
  # 功能：把各游戏模式的队伍数据同步到原版 Scoreboard Team，
  #       配合 JourneyMap Teams 实现队友可见、敌军隐藏、观战消失。
  #       注意：原版队伍数据是跟着玩家「当前所用的那块计分板」下发的，
  #       因此如果有别的插件给玩家换了独立计分板，本模块的队伍就传不过去。
  # ----------------------------------------------------------
  # ----------------------------------------------------------
  # 技术暂停模块
  # 功能：/wbdaddon pause 管理员暂停；/pause 玩家每队每场限次。
  #       暂停时会停掉 WBD 的 tick，回合与 C4 倒计时一起冻结。
  # ----------------------------------------------------------
  technical-pause:
    enabled: true

    # 管理员暂停的默认时长 / 最长时长（秒）
    admin-default-seconds: 60
    admin-max-seconds: 300

    # 每队每场可发起的暂停次数与时长（0 = 不开放玩家暂停）。
    # 玩家 /pause 只是预约：当前回合继续打完，下一回合开始才真正暂停。
    team-count: 1
    team-seconds: 60

    # 是否连 WBD 的 tick 一起停（回合 / C4 倒计时冻结）。
    # 反射失败时会自动退化为只冻结玩家。
    freeze-timers: true

    # 暂停期间是否冻结玩家（移动 / 伤害 / 交互）
    freeze-players: true

    # 提示文案。{team} 替换成「T 方 / CT 方 / 管理员」，{seconds} 替换成剩余秒数。
    # paused-title 同时是顶部 BossBar 的标题前缀（显示为「技术暂停 00:59」）。
    paused-title: "&e技术暂停"
    paused-subtitle: "&7{team} 请求暂停，剩余 {seconds} 秒"
    resumed-title: "&a比赛继续"

    # 断线等待时的 BossBar 标题与恢复标题
    hold-title: "&6等待重连"
    hold-resumed-title: "&a比赛继续"

    debug: false

  # ----------------------------------------------------------
  # 比赛投票
  # 功能：/vyes 同意、/vno 反对，投票期间顶部 BossBar 实时显示
  #       投票事项、双方票数与剩余时间，投票结束立刻收起。
  #
  #   /unpause          暂停期间全场投票提前解除暂停（全员同意）
  #   /vkick <队友>      同阵营投票踢人（被踢者默认反对，其余队友全员同意）
  #   /vmap <地图>       全场投票换图（超过 2/3 同意，提前结算并搬到新地图重开）
  #   /vsdr             同阵营投票投降（全员同意，判对方阵营获胜）
  # ----------------------------------------------------------
  vote:
    enabled: true

    # 一次投票持续多久（秒）。到时还没投的票按「未同意」处理。
    duration-seconds: 30

    # 同一房间同一类投票结束后的冷却（秒），防止连着刷。
    # 设为 0 关闭冷却。
    cooldown-seconds: 15

    # 全局投票（/unpause、/vmap）是否把观战者也算进票池。
    # false 时只有 T / CT 有资格投——观战者既帮不上忙，也不该左右别人的比赛。
    include-spectators: false

    # 排查用：在控制台输出发起 / 通过 / 否决 / 取消的日志
    debug: false

  # ----------------------------------------------------------
  # 断线重联
  # 功能：比赛进行中有参赛玩家掉线时，替他守住下一回合——
  #       当前回合照常打完，回合结算的间隙暂停（停 WBD 的 tick），
  #       直到他重连回来才继续。每支队伍每场只有一次这样的待遇。
  #       多人同时掉线共用同一次暂停（顶栏会显示还在等谁），名额按阵营算不按人头。
  #       重连后自动回到原阵营，并把掉线前的经济与战绩原样写回。
  # ----------------------------------------------------------
  reconnect:
    enabled: true

    # 「等多久」：到点还没回来就自动继续比赛，不会一直卡着大家（名额算用掉了）。
    # 默认 60 秒 = 一个技术暂停的长度。
    # 设为 0 表示不限时——不建议，掉线的人可能再也不回来。
    hold-max-seconds: 60

    # 「回来还算不算重连」：掉线后这个时间之内回来，仍然自动放回原比赛并继承数据；
    # 超过就当这个人弃赛，记录清空，他想打只能自己重新 /wbd join。
    # 默认 300 秒（5 分钟），0 表示永不失效。
    pending-max-seconds: 300

    # 玩家重连后是否自动放回原比赛的原阵营。
    # 关掉后仍然会记住数据，但需要他自己 /wbd join 回来。
    auto-rejoin: true

    # 排查用：输出掉线记录 / 等待开始 / 重连写回的日志
    debug: false

  journeymap-bridge:
    enabled: true

    # 同步间隔（tick）。20 tick = 1 秒。调大可以降低性能开销。
    sync-interval-ticks: 20

    # 服务器装了 WarZHideName 时，把「名字可见性」让给它，本模块不再写队伍条目。
    #
    # 原因：一个玩家在同一块记分板上只能属于一个队伍。两边都用 Team 控制名字时，
    # 互相 addEntry 会把对方踢出队伍——敌人名字就会时不时闪一下，暴露位置。
    # false = 强制同时启用（可能出现上面说的闪烁）。
    defer-to-hidename: true

    # 原版队伍名前缀，避免和其他插件的队伍冲突。
    # 实际生成的队伍名形如 <前缀><模式id>_<阵营id>，例如 wbd_bomb_def_T。
    # 带上模式 id 是必要的：爆破与死斗都有 T/CT，只按阵营拼名会让两个模式的玩家
    # 挤进同一个原版队伍，在 JourneyMap 上互相看得见。
    # 名字会被裁剪到原版 16 字符上限以内，所以前缀不宜过长。
    team-prefix: "wbd_"

  # ----------------------------------------------------------
  # 装备槽守卫
  # 功能：
  #   - 主武器只能 1 把，固定快捷栏第 1 格
  #   - 副武器（手枪）只能 1 把，固定第 2 格
  #   - 近战武器只能 1 把，固定第 3 格
  #   - 投掷物按 limits.throwable 限购（0 = 不限），第 4 格放一堆，其余进背包
  #   - 购买同类武器时替换旧武器，并退还旧武器的商店售价
  #   - 拾取同类武器时，必须先丢掉身上现有那把
  #
  # 说明：
  #   1. 这里不修改 WBD 的 shop.yml；价格从 WBD 已加载的 shop.yml 读取。
  #   2. 分类规则在 plugins/WBDAddon/item-categories.yml（guns / names /
  #      materials / types 四张表 + categories 开关与落点），这里只留兼容配置。
  #   3. 有些近战模组的刀在 TACZ index 里是 sniper，需要在 item-categories.yml
  #      的 guns 里覆盖成 melee，否则会被当成主武器。
  # ----------------------------------------------------------
  loadout-guard:
    enabled: true

    # 槽位锁定检查间隔（tick）。20 = 1 秒。
    # 事件发生时也会立即归位，这个定时任务只是兜底。
    lock-interval-ticks: 10

    # 槽位（0-8 为快捷栏）。四个槽位必须互不相同。
    # 注意不要和 WBD 的 c4-slot（默认 4）或商店开启物品槽位（默认 8）冲突。
    slots:
      primary: 0
      secondary: 1
      melee: 2
      throwable: 3

    # 每类最多携带数量。
    # 主武器 / 副武器 / 近战固定各 1 把，下面三项只用于可读性，改大也不会放宽。
    # 投掷物按总颗数计算（不是按堆叠数）；设为 0 会关闭投掷物上限。
    # 每类最多携带几件。0 = 不限。
    # 这里给的是「插件默认」，各服按自己的规则改（例如 CS 常见的投掷物上限 4）。
    limits:
      primary: 1
      secondary: 1
      melee: 1
      throwable: 0

    # 给识别过的装备打 WBDAddon 分类标签（PDC: loadout）。
    # 分类只认一次：之后换 TacZ 版本、改 gun-overrides 都不会让已经发出去的
    # 武器忽然换类别。认错了用 /wbdaddon retag 洗掉重认。
    tag-items: true

    # 刀不要钱：买刀（同类近战）时直接把手里的那把换掉，
    # 不做「同款拦截」，也不退旧刀的钱，省得背包里堆一堆旧刀。
    melee-always-swap: true

    # 购买“同类、同一把枪”时怎么处理：
    #   block             = 取消本次购买并退还本次购买的钱（推荐，防止免费补弹）
    #   replace-no-refund = 用新枪替换旧枪，不退旧枪的钱（相当于付费换新）
    #   replace-refund    = 用新枪替换旧枪，并退旧枪的钱（可能被用来免费补弹）
    same-gun-policy: block

    # 购买“同类、不同枪”时，是否退还旧武器的商店售价。
    # 旧武器价格从 WBD 的 shop.yml 读取；查不到价格时按 0 处理。
    refund-old-weapon: true

    # 发现同类武器多把（管理员 /give、旧数据、插件冲突）时，
    # 是否把多出来的丢到玩家脚下。false = 保留现场，不删也不丢。
    drop-duplicates: true

    # 商店绿宝石（开商店的道具）保护：不能丢弃、不能换到副手；
    # 被拖走 / 被购买顶掉 / 被别的插件清掉，下一秒自动放回固定槽位。
    protect-open-item: true

    # 打开商店的按键。服务端能收到的“按键”只有「交换副手」这一颗，
    # 单按太容易误触，所以默认用连按：
    #   double-swap      = 450ms 内连按两下 F（默认），单按 F 仍是原版换手
    #   swap-hands       = 直接按 F
    #   double-sneak     = 350ms 内连按两下 Shift
    #   sneak-swap-hands = 潜行时按 F（预留给 /wbda 菜单，商店别用）
    #   off              = 只能用绿宝石右键 / /wbd buy
    open-key: double-swap

    # 购买兜底：WBD 发物品时不检查「发不出去」——
    #   · 背包（36 格）全满时 addItem 的剩余堆叠被直接丢弃，钱却已经扣了；
    #   · 配了 give-slot 的商品会 setItem 直接覆盖那一格，原本的东西凭空消失。
    # 开启后会在扣钱瞬间抓一份背包快照，发现东西没到手就按比例退款，
    # 发现落点格被顶掉就把旧物品还回去（放不下就丢在脚下）。
    purchase-safety: true

    # 排查用：输出分类、替换、退款、归位日志。
    debug: false

    # ⚠ 分类规则已迁到 plugins/WBDAddon/item-categories.yml（优先级最高，自带注释）。
    #   下面的 tacz-type-categories / gun-overrides / *-materials 仍然兼容，
    #   但只在 item-categories.yml 没写到的物品上生效；新表首次生成时会抄一份这里的值。
    #
    # TACZ 枪械类型 -> 类别。
    # TACZ index 里 type 常见值：pistol / rifle / smg / shotgun / sniper / mg / rpg。
    # 没写的类型默认按 primary 处理，并在控制台提示一次。
    tacz-type-categories:
      pistol: secondary
      rifle: primary
      smg: primary
      shotgun: primary
      sniper: primary
      mg: primary
      rpg: primary
      melee: melee

    # 单把枪的类别覆盖，优先级高于 tacz-type-categories。
    # 例：某些近战模组的刀在 TACZ index 里被标成 sniper，就在这里改成 melee：
    #   "tacz:some_knife": melee
    gun-overrides: {}

    # 配件材质：单独一个类别（item-categories.yml 的 categories.attachment），
    # 只做「进背包」，不占快捷栏、不限购；关掉 attachment 类别就不再挪动。
    attachment-materials:
      - TACZ_ATTACHMENT

    # 这些材质买到 / 捡到后直接进背包（9-35 格），不占快捷栏。
    # WBD 用 addItem 发商品，而 addItem 会先填快捷栏——买配件把枪挤到背包里就很别扭。
    # 背包满了就不动它，不会把东西弄丢。
    backpack-materials:
      - TACZ_ATTACHMENT

    # 材质 -> 类别。按 Bukkit Material 名称填写；
    # 当前服务端不存在的材质会被忽略，所以下面这些默认值只为方便
    # LRTactical / TacZ 用户，没装对应模组时不会报错。
    throwable-materials:
      - LRTACTICAL_THROWABLE
    melee-materials:
      - LRTACTICAL_MELEE
    utility-materials:
      - LRTACTICAL_CONSUMABLE
      - TACZ_AMMO
      - SHEARS
      - POTION

    # TACZ 枪械物品的 Bukkit Material 名称。
    # 只有这个材质的物品才会去问 TacZSpigotBridge 要 GunId。
    tacz-gun-material: TACZ_MODERN_KINETIC_GUN

    # 提示文案。%category% 是“主武器/副武器/近战武器/投掷物”，
    # %old%/%new% 是物品名，%refund%/%price% 是金额。
    messages:
      replaced: "&a已替换 %old% &7→ &a%new%&7，退还 &e$%refund%"
      replaced-no-refund: "&a已替换 %old% &7→ &a%new%&7（旧武器无商店售价）"
      same-gun-blocked: "&c你已装备 %gun%&c，本次购买已取消并退还 &e$%price%"
      same-gun-blocked-free: "&c你已装备 %gun%&c，本次购买已取消。"
      melee-swapped: "&a已换上 &f%new%&7。"
      buy-blocked: "&c你已装备 %old%&c，本次购买已取消并退还 &e$%price%"
      buy-blocked-free: "&c你已装备 %old%&c，本次购买已取消。"
      purchase-missing: "&c背包放不下，购买的物品没有给到你，已退还 &e$%price%"
      purchase-missing-free: "&c背包放不下，这次购买的物品没有给到你。"
      slot-restored: "&7购买覆盖了那一格，已把 &f%item% &7放回背包。"
      open-item-locked: "&c商店绿宝石不能丢弃。"
      throwable-full: "&c投掷物最多携带 %limit% 颗，超出部分已退还 &e$%refund%"
      throwable-full-no-refund: "&c投掷物最多携带 %limit% 颗，超出部分已移除。"
      throwable-excess: "&c投掷物超过上限 %limit% 颗，多出的 %amount% 颗已丢到脚下。"
      throwable-pickup-blocked: "&c你最多携带 %limit% 颗投掷物。"
      pickup-blocked: "&c你已装备%category%，需要先丢弃当前这把才能拾取。"
      duplicate-dropped: "&7检测到多出的%category% &f%item%&7，已丢到脚下。"
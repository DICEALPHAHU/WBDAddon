# ============================================================
# WBDAddon 配置文件
# WarZBombDefuse 的第三方附加组件合集
#
# 修改后执行 /wbdaddon reload 即可生效，无需重启服务器。
# 颜色代码用 & 符号，例如 &c 表示红色。
# ============================================================

# 模块总开关。每个模块可以独立启停，互不影响。
modules:

  # ----------------------------------------------------------
  # 击杀报告模块
  # 功能：替换默认的淘汰消息，显示击杀者与武器；
  #       回合结束时给每位玩家单独发送各自的伤害统计。
  # ----------------------------------------------------------
  kill-reports:
    enabled: true

    # 是否替换 WarZBombDefuse 默认的淘汰消息
    replace-default-death-message: true

    # 是否在回合结束时给每位玩家单独发送各自的伤害统计
    show-round-summary: true

    # 伤害数值保留几位小数
    damage-decimal-places: 1

    # 有击杀者时的死亡消息（主动句，避免被字句的翻译腔）
    # 占位符：%victim% 被淘汰者，%killer% 击杀者，%weapon% 武器名
    death-message-with-killer: "&c%killer% &7使用 &e%weapon% &7淘汰了 &c%victim%"

    # 无击杀者时的死亡消息（自杀、C4 爆炸、摔落等）
    # 占位符：%victim% 被淘汰者
    death-message-no-killer: "&c%victim% &7已被淘汰"

    # 每位玩家独享的伤害统计标题和页脚（用青色 &b 与 WBD 淘汰消息区分）
    round-summary-title: "&b====== 你的伤害统计 ======"
    round-summary-footer: "&b========================"

    # 每个玩家对自己造成伤害的目标的单行格式
    # 占位符：%victim% 被打的玩家，%damage% 你对 TA 造成的伤害
    damage-line-format: "你对 &f%victim% &7造成了 &b%damage% &7伤害"

  # ----------------------------------------------------------
  # 比赛状态显示模块
  # 功能：顶部（ActionBar）显示 T / CT 当前存活人数；
  #       炸弹安放后用 BossBar 显示倒计时进度条，爆/拆后消失。
  # ----------------------------------------------------------
  match-status:
    enabled: true

    # 是否在顶部用 ActionBar 显示双方存活人数
    enable-alive-action-bar: true

    # 是否用 BossBar 显示炸弹倒计时（安放后出现，爆/拆后消失）
    enable-bomb-bar: true

    # 刷新间隔（tick）。20 = 1 秒，调大省资源，调小更实时
    update-interval-ticks: 2

    # 存活人数文字格式
    # 占位符：%t_alive%/%t_total% T 存活/总，%ct_alive%/%ct_total% CT 存活/总
    alive-line-format: "&cT 存活 &f%t_alive%&7/&f%t_total%   &bCT 存活 &f%ct_alive%&7/&f%ct_total%"

    # 存活显示样式：number = 数字（3/5）；block = 方块（每人一个方块）
    alive-display-style: number

    # ↓ 以下仅在 alive-display-style: block 时生效
    # 默认存活/淘汰都用同一个「■」字形，靠亮色/暗色区分，
    # 保证两者绝对等宽；想换成「填/空」样式就把 block-dead-char 改成 "□"
    block-alive-char: "■"
    block-dead-char: "■"
    block-t-color: "&c"           # T 方存活（亮红）
    block-t-dead-color: "&4"      # T 方淘汰（暗红）
    block-ct-color: "&9"          # CT 方存活（亮蓝）
    block-ct-dead-color: "&1"     # CT 方淘汰（暗蓝）
    # 方块行格式；%t_blocks% / %ct_blocks% = 两队的方块串（淘汰在前、存活在后）
    block-line-format: "&cT方 %t_blocks%  &9CT方 %ct_blocks%"

    # 炸弹倒计时 BossBar 的标题、颜色、样式
    # 颜色可选：PINK BLUE RED GREEN YELLOW PURPLE WHITE
    # 样式可选：SOLID SEGMENTED_6 SEGMENTED_10 SEGMENTED_12 SEGMENTED_20
    bomb-bar-title: "&c炸弹 &7还有 &e%sec% &7秒爆炸"
    bomb-bar-color: RED
    bomb-bar-style: SOLID

  # ----------------------------------------------------------
  # 拆弹声音提示模块
  # 功能：CT 开始拆弹时，在 C4 位置向全图播放可定位的音效，让 T 阵营
  #       能凭声音判断「有人在拆弹」以及大致方位，从而回防博弈。
  #
  #       WBD 本体只在「拆除成功」和「进度被中断」时有音效，
  #       开始拆弹与整个拆弹过程是完全静音的，本模块补的就是这一段。
  # ----------------------------------------------------------
  bomb-defuse-sound:
    enabled: true

    # 开始拆弹提示音：低沉一声「嘟」，与滴答的高音形成电子设备启动感。
    # 音效名必须是本服务端存在的 Bukkit Sound 枚举名，留空 "" 表示关闭。
    # 挑音效用 /wbdaddon sound 试听，不带参数会列出推荐清单。
    # 音量决定可听距离，约等于 16 × 音量（格）：2.0 ≈ 32 格。
    # 客户端会对音量限幅，所以调大只会传得更远，不会把近处玩家震聋。
    start-sound: BLOCK_NOTE_BLOCK_BIT
    start-volume: 2.0
    start-pitch: 0.7

    # 拆弹过程中的滴答声。留空 "" 关闭滴答。
    # 默认用 8-bit 芯片音色，也就是电子设备那种「嘀嘀嘀」
    tick-sound: BLOCK_NOTE_BLOCK_BIT
    tick-volume: 2.0
    tick-pitch: 1.8
    # 滴答间隔（tick）。20 tick = 1 秒。调小更急促，调大更从容
    tick-interval-ticks: 10

    # 拆弹中断（松手、被打断、拆弹者死亡）提示音。
    # WBD 本体已对当事人播放 cancel 音效，故默认留空以免重复
    cancel-sound: ""
    cancel-volume: 2.0
    cancel-pitch: 0.8

    # 拆弹成功提示音。WBD 本体已播 bomb-defused，故默认留空以免重复
    complete-sound: ""
    complete-volume: 2.0
    complete-pitch: 1.8

    # 听众范围：
    #   arena = 只播给该竞技场内的玩家（含已淘汰的旁观者），与 WBD 惯例一致
    #   world = 播给炸弹所在世界的所有玩家（含大厅与其他竞技场）
    # 两种范围都以 C4 位置为音源，因此都带方位感
    audience: arena

    # 兜底保护：单次拆弹超过该秒数后强制停止滴答。
    # 正常拆弹只有几秒，这一项仅用于事件丢失时防止滴答停不下来
    max-duration-seconds: 30

    # 排查用：在控制台输出拆弹事件的触发日志
    debug: false

  # ----------------------------------------------------------
  # 竞技场饥饿锁定模块
  # 功能：竞技场玩家跑步会消耗饥饿、饿到跑不动；满饥饿又触发自然回血。
  #       MC 规则：跑速只在饥饿 <6 变慢，自然回血需饥饿 ≥18。
  #       所以把竞技场玩家饥饿恒定到 17（跑速恒定、不自然回血），
  #       并把饱和度清零封死回血条件。只作用于竞技场玩家，不影响全局。
  # ----------------------------------------------------------
  arena-food:
    enabled: true

    # 重置间隔（tick）。20 = 1 秒
    update-interval-ticks: 5

    # 恒定的饥饿值（10-19 都安全：跑速正常且不回血；默认 17 视觉接近满）
    food-level: 17

    # 恒定的饱和度（0 封死自然回血）
    saturation: 0

  # ----------------------------------------------------------
  # 防第三人称模块
  # 功能：有些玩家会切到第三人称视角，隔着掩体看到不该看的位置。
  #       第三人称是客户端按键，服务端无法真正禁用或侦测，所以改用
  #       「遮挡」思路：给参赛玩家挂一个巨大的黑色遮挡面，且只对该玩家
  #       本人可见——切到第三人称时遮挡面会糊住视野，第三人称就失去
  #       偷看价值了。只在竞技场内生效，观战与大厅不受影响。
  #       实现方案参考开源插件 AntiF5 (https://github.com/ladakx/AntiF5)
  # ----------------------------------------------------------
  antithirdcam:
    enabled: true

    # 检查间隔（tick）。遮挡面靠「乘客」机制自动跟随玩家，
    # 这里只负责低频检查、丢失时重建。20 = 1 秒
    update-interval-ticks: 20

    # 只对竞技场内「参赛」玩家生效（观战、大厅不受影响）
    only-in-arena: true

    # 遮挡面文字。默认「黑色实心方块」（§0 = 黑色，█ = 实心方块）
    # 也支持 & 颜色代码，例如 &0█
    overlay-text: "§0█"

    # 渲染平移（方块）。位置不对时调这里
    translation-x: 0.0
    translation-y: -16.0
    translation-z: 1.0

    # 缩放倍数。第三人称挡不住 → 加大；第一人称也被挡 → 减小
    scale-x: 128.0
    scale-y: 128.0
    scale-z: 128.0

    # 背景色（ARGB 十六进制）。0xFF000000 = 不透明黑
    background-argb: "0xFF000000"

    # 文字不透明度 0-255
    text-opacity: 255

    # 是否穿透方块渲染 / 是否投影
    see-through: true
    shadowed: true

    # 渲染距离上限。setViewRange 是 Paper 扩展方法，
    # Arclight/Spigot 不支持时会自动跳过，不影响使用
    view-range: 8.0

  # ----------------------------------------------------------
  # JourneyMap 桥接模块
  # 功能：把 WarZBombDefuse 的队伍数据同步到原版 Scoreboard Team，
  #       配合 JourneyMap Teams 实现队友可见、敌军隐藏、观战消失。
  # ----------------------------------------------------------
  journeymap-bridge:
    enabled: true

    # 同步间隔（tick）。20 tick = 1 秒。调大可以降低性能开销。
    sync-interval-ticks: 20

    # 原版队伍名前缀，避免和其他插件的队伍冲突
    team-prefix: "wbd_"
name: WBDAddon
# 版本号由 Maven 在打包时从 pom.xml 注入（resources filtering），
# 升版本只需改 pom.xml 一处，不会出现 plugin.yml 与 pom 不同步
version: ${project.version}
main: alphahu.wbdaddon.WBDAddon
api-version: '1.20'
authors: [AlphaHu]
description: WarZBombDefuse 的第三方附加组件合集：击杀报告、回合伤害统计、比赛状态显示、竞技场饥饿锁定、防第三人称、JourneyMap 桥接。
website: https://github.com/DICEALPHAHU/WBDAddon

# 硬依赖：没有 WarZBombDefuse 就不加载
depend:
  - WarZBombDefuse

# 软依赖：有则更好，没有也能跑
softdepend:
  - TacZSpigotBridge
  - PlaceholderAPI
  - JourneyMap

commands:
  wbdaddon:
    description: WBDAddon 主命令
    aliases: [wbdaddon, wbdreport]
    usage: /wbdaddon help
    permission: wbdaddon.use

permissions:
  wbdaddon.use:
    description: 允许使用 WBDAddon 的基础命令
    default: true
  wbdaddon.admin:
    description: 允许重载配置、管理模块
    default: op